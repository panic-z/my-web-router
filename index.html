<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShiba | AI Info and Resume Maker</title>
    <meta
      name="description"
      content="CyberShiba is the shared gateway to AI Info and Resume Maker. Explore curated AI news, build a polished resume, or share portal feedback in your browser."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://www.cybershiba.cn/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CyberShiba" />
    <meta property="og:title" content="CyberShiba | AI Info and Resume Maker" />
    <meta
      property="og:description"
      content="Open AI Info for curated AI updates, jump into Resume Maker to create and export a polished resume, or share feedback from the portal."
    />
    <meta property="og:url" content="https://www.cybershiba.cn/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CyberShiba | AI Info and Resume Maker" />
    <meta
      name="twitter:description"
      content="A shared entry point for AI Info, Resume Maker, and portal feedback on CyberShiba."
    />
    <script type="application/ld+json" id="structured-data">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CyberShiba",
        "url": "https://www.cybershiba.cn/",
        "description": "A shared entry point for AI Info, Resume Maker, and portal feedback.",
        "hasPart": [
          {
            "@type": "WebSite",
            "name": "AI Info",
            "url": "https://www.cybershiba.cn/ai-info"
          },
          {
            "@type": "WebApplication",
            "name": "Resume Maker",
            "url": "https://www.cybershiba.cn/resume-maker"
          }
        ]
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3ea;
        --panel: rgba(255, 252, 245, 0.9);
        --text: #1f2937;
        --muted: #6b7280;
        --line: rgba(31, 41, 55, 0.12);
        --accent: #b45309;
        --accent-strong: #7c2d12;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Georgia", "Noto Serif SC", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(180, 83, 9, 0.18), transparent 35%),
          radial-gradient(circle at bottom right, rgba(124, 45, 18, 0.14), transparent 32%),
          linear-gradient(135deg, #f9f6ef 0%, #efe4d1 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(760px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 40px 28px;
        box-shadow: 0 24px 80px rgba(31, 41, 55, 0.08);
        backdrop-filter: blur(8px);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .eyebrow {
        margin: 0;
        color: var(--accent-strong);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .lang-switch {
        display: inline-flex;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
      }

      .lang-switch button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
      }

      .lang-switch button.is-active {
        background: var(--accent-strong);
        color: #fffaf5;
      }

      h1 {
        margin: 18px 0 0;
        font-size: clamp(40px, 8vw, 72px);
        line-height: 0.95;
      }

      p {
        margin: 20px 0 0;
        max-width: 42rem;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.7;
      }

      nav {
        display: grid;
        gap: 14px;
        margin-top: 32px;
      }

      a {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 20px;
        border-radius: 18px;
        border: 1px solid var(--line);
        color: inherit;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.64);
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      a:hover {
        transform: translateY(-1px);
        border-color: rgba(180, 83, 9, 0.35);
        background: rgba(255, 255, 255, 0.9);
      }

      strong {
        font-size: 20px;
      }

      span {
        color: var(--accent);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <p class="eyebrow" data-i18n="eyebrow">CyberShiba Portal</p>
        <div class="lang-switch" aria-label="Language switcher">
          <button type="button" class="is-active" data-lang-button="en">EN</button>
          <button type="button" data-lang-button="zh">中文</button>
        </div>
      </div>
      <h1 data-i18n="heroTitle">Welcome to CyberShiba</h1>
      <p data-i18n="description">
        This is the shared entry point. You can head into the AI news hub, open
        the resume builder directly, or share feedback.
      </p>
      <nav>
        <a href="/ai-info">
          <strong data-i18n="aiInfo">Open AI Info</strong>
          <span>/ai-info</span>
        </a>
        <a href="/resume-maker">
          <strong data-i18n="resumeMaker">Open Resume Maker</strong>
          <span>/resume-maker</span>
        </a>
        <a href="/feedback?product=portal">
          <strong data-i18n="feedback">Open Feedback</strong>
          <span>/feedback?product=portal</span>
        </a>
      </nav>
    </main>
    <script>
      const messages = {
        en: {
          lang: "en",
          seoTitle: "CyberShiba | AI Info and Resume Maker",
          descriptionMeta:
            "CyberShiba is the shared gateway to AI Info and Resume Maker. Explore curated AI news, build a polished resume, or share portal feedback in your browser.",
          ogDescription:
            "Open AI Info for curated AI updates, jump into Resume Maker to create and export a polished resume, or share feedback from the portal.",
          twitterDescription:
            "A shared entry point for AI Info, Resume Maker, and portal feedback on CyberShiba.",
          eyebrow: "CyberShiba Portal",
          heroTitle: "Welcome to CyberShiba",
          description:
            "This is the shared entry point. You can head into the AI news hub, open the resume builder directly, or share feedback.",
          aiInfo: "Open AI Info",
          resumeMaker: "Open Resume Maker",
          feedback: "Open Feedback",
        },
        zh: {
          lang: "zh-CN",
          seoTitle: "CyberShiba | AI Info 与 Resume Maker",
          descriptionMeta:
            "CyberShiba 是 AI Info、Resume Maker 和反馈入口的统一入口。你可以浏览精选 AI 资讯，开始制作简历，或提交门户反馈。",
          ogDescription:
            "进入 AI Info 获取精选 AI 资讯，打开 Resume Maker 在线制作并导出简历，或从门户提交反馈。",
          twitterDescription:
            "CyberShiba 提供 AI Info、Resume Maker 和门户反馈的统一入口。",
          eyebrow: "CyberShiba Portal",
          heroTitle: "欢迎来到 CyberShiba",
          description:
            "这里是统一入口。你可以从这里进入 AI 资讯站，直接打开简历制作工具，或者提交反馈。",
          aiInfo: "进入 AI Info",
          resumeMaker: "进入 Resume Maker",
          feedback: "进入反馈",
        },
      };

      const buttons = document.querySelectorAll("[data-lang-button]");

      function setLanguage(language) {
        const message = messages[language] ?? messages.en;

        document.documentElement.lang = message.lang;
        document.title = message.seoTitle;
        document.querySelectorAll("[data-i18n]").forEach((node) => {
          const key = node.getAttribute("data-i18n");
          if (key && message[key]) {
            node.textContent = message[key];
          }
        });

        const description = document.querySelector('meta[name="description"]');
        const ogTitle = document.querySelector('meta[property="og:title"]');
        const ogDescription = document.querySelector('meta[property="og:description"]');
        const twitterTitle = document.querySelector('meta[name="twitter:title"]');
        const twitterDescription = document.querySelector('meta[name="twitter:description"]');
        const structuredData = document.getElementById("structured-data");

        description?.setAttribute("content", message.descriptionMeta);
        ogTitle?.setAttribute("content", message.seoTitle);
        ogDescription?.setAttribute("content", message.ogDescription);
        twitterTitle?.setAttribute("content", message.seoTitle);
        twitterDescription?.setAttribute("content", message.twitterDescription);

        if (structuredData) {
          structuredData.textContent = JSON.stringify(
            {
              "@context": "https://schema.org",
              "@type": "WebSite",
              name: "CyberShiba",
              url: "https://www.cybershiba.cn/",
              description: message.descriptionMeta,
              hasPart: [
                {
                  "@type": "WebSite",
                  name: "AI Info",
                  url: "https://www.cybershiba.cn/ai-info",
                },
                {
                  "@type": "WebApplication",
                  name: "Resume Maker",
                  url: "https://www.cybershiba.cn/resume-maker",
                },
              ],
              inLanguage: message.lang,
            },
            null,
            2
          );
        }

        buttons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.langButton === language);
        });

        try {
          localStorage.setItem("cybershiba-language", language);
        } catch {}
      }

      const storedLanguage = (() => {
        try {
          return localStorage.getItem("cybershiba-language");
        } catch {
          return null;
        }
      })();

      setLanguage(storedLanguage === "zh" ? "zh" : "en");

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          setLanguage(button.dataset.langButton === "zh" ? "zh" : "en");
        });
      });
    </script>
  </body>
</html>
